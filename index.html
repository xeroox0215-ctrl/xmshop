<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>XMprivat SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#000;color:#fff;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.app{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:20px 16px 40px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:38px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fff 0%,#00e0ff 50%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:sh 3s linear infinite}
.logo p{color:#555;font-size:11px;letter-spacing:5px;margin-top:4px}
@keyframes sh{to{background-position:200% center}}
.sec{font-size:12px;color:#666;letter-spacing:3px;margin:24px 0 12px 4px;font-weight:700;text-transform:uppercase}
.btn{display:flex;align-items:center;width:100%;padding:16px 18px;margin-bottom:10px;background:linear-gradient(135deg,rgba(20,20,20,.9),rgba(30,30,30,.9));border:1px solid rgba(255,255,255,.08);border-radius:16px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:transform .1s}
.btn:active{transform:scale(.97);background:rgba(0,224,255,.12);border-color:rgba(0,224,255,.4)}
.btn .ic{font-size:24px;margin-right:14px;width:32px;text-align:center;flex-shrink:0}
.btn .tx{flex:1;min-width:0}
.btn .nm{font-weight:700;font-size:15px;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .sb{font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .pr{font-size:14px;color:#00e0ff;font-weight:900;margin-left:10px;white-space:nowrap;flex-shrink:0}
.btn .ar{color:#555;font-size:20px;margin-left:8px;flex-shrink:0}
</style>
</head>
<body>
<div id="stars"></div>
<div class="app">
<div class="logo"><h1>XMPRIVAT</h1><p>SHOP</p></div>

<div class="sec">👑 Приватка</div>
<button class="btn" onclick="g('priv_week')"><span class="ic">👑</span><span class="tx"><div class="nm">Приватка на неделю</div><div class="sb">7 дней доступа</div></span><span class="pr">80 ⭐</span></button>
<button class="btn" onclick="g('priv_month')"><span class="ic">👑</span><span class="tx"><div class="nm">Приватка на месяц</div><div class="sb">30 дней доступа</div></span><span class="pr">130 ⭐</span></button>
<button class="btn" onclick="g('priv_forever')"><span class="ic">👑</span><span class="tx"><div class="nm">Приватка навсегда</div><div class="sb">бессрочно</div></span><span class="pr">200 ⭐</span></button>

<div class="sec">📄 Конфиги</div>
<button class="btn" onclick="g('conf_100')"><span class="ic">📄</span><span class="tx"><div class="nm">Конфиг</div><div class="sb">файл .pcfg + инструкция</div></span><span class="pr">100 ⭐</span></button>
<button class="btn" onclick="g('conf_priv_175')"><span class="ic">📄</span><span class="tx"><div class="nm">Конфиг + приватка</div><div class="sb">конфиг и доступ навсегда</div></span><span class="pr">175 ⭐</span></button>

<div class="sec">⚔️ Сеты</div>
<button class="btn" onclick="g('set_z5viva')"><span class="ic">⚔️</span><span class="tx"><div class="nm">Сет z5 + вива</div><div class="sb">кастом под тебя</div></span><span class="pr">85 ⭐</span></button>
<button class="btn" onclick="g('set_nerkapb')"><span class="ic">⚔️</span><span class="tx"><div class="nm">Сет нерка + пб</div><div class="sb">кастом под тебя</div></span><span class="pr">200 ⭐</span></button>
<div class="sec">📜 Скрипты</div>
<button class="btn" onclick="g('sc_totem')"><span class="ic">🛡️</span><span class="tx"><div class="nm">Авто тотем</div><div class="sb">авто-поднятие при низком HP</div></span><span class="pr">25 ⭐</span></button>
<button class="btn" onclick="g('sc_build')"><span class="ic">🧱</span><span class="tx"><div class="nm">Застрой</div><div class="sb">авто-застройка стен</div></span><span class="pr">25 ⭐</span></button>
<button class="btn" onclick="g('sc_freeze')"><span class="ic">🥶</span><span class="tx"><div class="nm">Завис</div><div class="sb">фриз противника</div></span><span class="pr">25 ⭐</span></button>
<button class="btn" onclick="g('sc_opt')"><span class="ic">🚀</span><span class="tx"><div class="nm">Оптимизации</div><div class="sb">FPS boost + снижение пинга</div></span><span class="pr">25 ⭐</span></button>

<div class="sec">📢 Реклама</div>
<button class="btn" onclick="g('adv_day1')"><span class="ic">📢</span><span class="tx"><div class="nm">Реклама 1 день</div><div class="sb">24 часа рассылки</div></span><span class="pr">65 ⭐</span></button>
<button class="btn" onclick="g('adv_day2')"><span class="ic">📢</span><span class="tx"><div class="nm">Реклама 2 дня</div><div class="sb">48 часов рассылки</div></span><span class="pr">80 ⭐</span></button>
<button class="btn" onclick="g('adv_day3')"><span class="ic">📢</span><span class="tx"><div class="nm">Реклама 3 дня</div><div class="sb">72 часа рассылки</div></span><span class="pr">100 ⭐</span></button>
<button class="btn" onclick="g('adv_week')"><span class="ic">📢</span><span class="tx"><div class="nm">Реклама неделя</div><div class="sb">7 дней рассылки</div></span><span class="pr">150 ⭐</span></button>

<div class="sec">⚙️ Сервис</div>
<button class="btn" onclick="g('profile')"><span class="ic">👤</span><span class="tx"><div class="nm">Мой профиль</div><div class="sb">подписка и баллы</div></span><span class="ar">></span></button>
<button class="btn" onclick="g('promos')"><span class="ic">🎫</span><span class="tx"><div class="nm">Промокоды</div><div class="sb">скидки за баллы</div></span><span class="ar">></span></button>
<button class="btn" onclick="g('activate')"><span class="ic">🎁</span><span class="tx"><div class="nm">Активировать код</div><div class="sb">введи ключ</div></span><span class="ar">></span></button>
<button class="btn" onclick="g('support')"><span class="ic">🛠️</span><span class="tx"><div class="nm">Поддержка</div><div class="sb">напиши вопрос админу</div></span><span class="ar">></span></button>

</div>
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

(function () {
    var c = document.getElementById("stars");
    for (var i = 0; i < 60; i++) {
        var s = document.createElement("div");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        var sz = Math.random() * 2 + 1;
        s.style.width = sz + "px";
        s.style.height = sz + "px";
        s.style.animationDelay = Math.random() * 3 + "s";
        c.appendChild(s);
    }
})();

function g(target) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
    if (!tg) { window.location.href = "https://t.me/XMPrivateBot"; return; }
    try {
        tg.sendData(JSON.stringify({ action: "go", target: target }));
        setTimeout(function(){ tg.close(); }, 300);
    } catch(e) { window.location.href = "https://t.me/XMPrivateBot"; }
}
</script>
</body>
</html>
