<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XMprivat SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; user-select: none; }
#stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.5; animation: twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
.app { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }
.logo { text-align: center; margin-bottom: 30px; }
.logo h1 { font-size: 38px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(90deg, #fff 0%, #00e0ff 50%, #fff 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
.logo p { color: #555; font-size: 12px; letter-spacing: 4px; margin-top: 6px; }
@keyframes shine { to { background-position: 200% center; } }
.menu-btn { display: flex; align-items: center; width: 100%; padding: 18px 20px; margin-bottom: 10px; background: rgba(20, 20, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; text-align: left; }
.menu-btn:active { transform: scale(0.97); background: rgba(0, 224, 255, 0.1); }
.menu-btn .icon { font-size: 24px; margin-right: 16px; width: 30px; text-align: center; }
.menu-btn .arrow { margin-left: auto; color: #555; font-size: 18px; }
</style>
</head>
<body>
<div id="stars"></div>
<div class="app">
    <div class="logo">
        <h1>XMPRIVAT</h1>
        <p>SHOP</p>
    </div>
    <div id="main">
        <button class="menu-btn" onclick="go('priv_week')"><span class="icon">👑</span> Приватка на неделю <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('priv_month')"><span class="icon">👑</span> Приватка на месяц <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('priv_forever')"><span class="icon">👑</span> Приватка навсегда <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('conf_100')"><span class="icon">📄</span> Конфиг <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('conf_priv_175')"><span class="icon">📄</span> Конфиг + приватка <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('set_z5viva')"><span class="icon">⚔️</span> Сет z5 + вива <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('set_nerkapb')"><span class="icon">⚔️</span> Сет нерка + пб <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('sc_totem')"><span class="icon">🛡️</span> Авто тотем <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('sc_build')"><span class="icon">🧱</span> Застрой <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('sc_freeze')"><span class="icon">🥶</span> Завис <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('sc_opt')"><span class="icon">🚀</span> Оптимизации <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('profile')"><span class="icon">👤</span> Мой профиль <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('promos')"><span class="icon">🎫</span> Промокоды <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('activate')"><span class="icon">🎁</span> Активировать код <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('support')"><span class="icon">🛠️</span> Поддержка <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="go('reviews')"><span class="icon">⭐</span> Отзывы <span class="arrow">›</span></button>
    </div>
</div>
    
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;

(function () {
    var c = document.getElementById('stars');
    for (var i = 0; i < 60; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        var sz = Math.random() * 2 + 1;
        s.style.width = sz + 'px';
        s.style.height = sz + 'px';
        s.style.animationDelay = Math.random() * 3 + 's';
        c.appendChild(s);
    }
})();

if (tg) {
    tg.ready();
    tg.expand();
}

function go(target) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    if (!tg) {
        window.location.href = 'https://t.me/XMPrivateBot';
        return;
    }
    try {
        tg.sendData(JSON.stringify({ action: 'go', target: target }));
        setTimeout(function(){ tg.close(); }, 300);
    } catch(e) {
        window.location.href = 'https://t.me/XMPrivateBot';
    }
}
</script>
</body>
</html>
