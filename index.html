<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XMprivat SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; user-select: none; }
#stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.5; animation: twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
.app { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; }
.logo { text-align: center; margin-bottom: 30px; }
.logo h1 { font-size: 38px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(90deg, #fff 0%, #00e0ff 50%, #fff 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
.logo p { color: #555; font-size: 12px; letter-spacing: 4px; margin-top: 6px; }
@keyframes shine { to { background-position: 200% center; } }
.menu-btn { display: flex; align-items: center; width: 100%; padding: 18px 20px; margin-bottom: 10px; background: rgba(20, 20, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; text-align: left; }
.menu-btn:active { transform: scale(0.97); background: rgba(0, 224, 255, 0.1); }
.menu-btn .icon { font-size: 24px; margin-right: 16px; width: 30px; text-align: center; }
.menu-btn .arrow { margin-left: auto; color: #555; font-size: 18px; }
.page { display: none; }
.page.active { display: block; }
.back-btn { display: inline-flex; align-items: center; padding: 8px 16px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; font-size: 14px; cursor: pointer; }
.page-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(90deg, #fff, #00e0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.page-desc { color: #666; font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
.card { padding: 18px; margin-bottom: 12px; background: rgba(20, 20, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; }
.card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.card-desc { font-size: 13px; color: #777; margin-bottom: 14px; line-height: 1.5; }
.card-price { font-size: 20px; font-weight: 800; color: #00e0ff; margin-bottom: 12px; }
.buy-btn { width: 100%; padding: 16px; background: linear-gradient(90deg, #00e0ff, #0099ff); border: none; border-radius: 12px; color: #000; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 8px; }
.buy-btn:active { transform: scale(0.97); }
.loader { text-align: center; padding: 40px; color: #555; }
</style>
</head>
<body>
<div id="stars"></div>
<div class="app">
    <div class="logo">
        <h1>XMPRIVAT</h1>
        <p>SHOP</p>
    </div>

    <div id="main" class="page active">
        <button class="menu-btn" onclick="openBot('catalog')"><span class="icon">👑</span> Приватка <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('catalog')"><span class="icon">📄</span> Конфиг <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('catalog')"><span class="icon">⚔️</span> Сеты <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('catalog')"><span class="icon">📜</span> Скрипты <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('profile')"><span class="icon">👤</span> Мой профиль <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('promos')"><span class="icon">🎫</span> Промокоды <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('activate')"><span class="icon">🎁</span> Активировать код <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('support')"><span class="icon">🛠️</span> Поддержка <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="openBot('reviews')"><span class="icon">⭐</span> Отзывы <span class="arrow">›</span></button>
        <button class="menu-btn" onclick="showPage('faq')"><span class="icon">❓</span> FAQ <span class="arrow">›</span></button>
    </div>

    <div id="faq" class="page">
        <button class="back-btn" onclick="showPage('main')">‹ Назад</button>
        <div class="page-title">❓ FAQ</div>
        <div id="faqContent" class="loader">Загрузка</div>
    </div>
</div>

<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;

(function () {
    var c = document.getElementById('stars');
    for (var i = 0; i < 60; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        var sz = Math.random() * 2 + 1;
        s.style.width = sz + 'px';
        s.style.height = sz + 'px';
        s.style.animationDelay = Math.random() * 3 + 's';
        c.appendChild(s);
    }
})();

if (tg) {
    tg.ready();
    tg.expand();
}

function openBot(arg) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    if (tg) {
        tg.close();
        setTimeout(function () {
            tg.openTelegramLink('https://t.me/XMPrivateBot');
        }, 300);
    } else {
        window.location.href = 'https://t.me/XMPrivateBot';
    }
}

var FAQ_DATA = [
    ['Что такое приватка?', 'Общение с владельцами, помощь, ролики, конкурсы.'],
    ['Как оплатить?', 'Через Telegram Stars в боте.'],
    ['Как долго ждать?', 'Приватка и конфиг — мгновенно.'],
    ['Что после оплаты?', 'Получишь ключ в чат.'],
    ['Что за конфиг?', 'Настройки с биндами.'],
    ['Не пришёл товар?', 'Напиши в поддержку в боте.'],
    ['Что за баллы?', '5 баллов за друга.'],
    ['Как пригласить друга?', 'В профиле в боте — кнопка.']
];

function loadFaq() {
    var c = document.getElementById('faqContent');
    c.className = '';
    var html = '';
    for (var i = 0; i < FAQ_DATA.length; i++) {
        html += '<div class="card"><div class="card-title">❓ ' + FAQ_DATA[i][0] + '</div><div class="card-desc">' + FAQ_DATA[i][1] + '</div></div>';
    }
    c.innerHTML = html;
}

function showPage(id) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
    document.getElementById(id).classList.add('active');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (id === 'faq') loadFaq();
}
</script>
</body>
</html>
