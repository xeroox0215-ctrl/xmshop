<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XMprivat SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#000;color:#fff;padding:20px 16px 40px;min-height:100vh}
.app{max-width:500px;margin:0 auto}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:36px;font-weight:900;color:#00e0ff;letter-spacing:3px}
.logo p{color:#555;font-size:11px;letter-spacing:4px}
.title{font-size:11px;color:#666;letter-spacing:3px;margin:22px 0 10px;font-weight:700}
.btn{display:flex;align-items:center;width:100%;padding:16px 18px;margin-bottom:8px;background:#141414;border:1px solid #222;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.btn:active{background:#0a1f24}
.btn .ic{font-size:22px;margin-right:14px;width:28px;text-align:center;flex-shrink:0}
.btn .nm{flex:1}
.btn .pr{font-size:14px;color:#00e0ff;font-weight:900;margin-left:10px}
</style>
</head>
<body>
<div class="app">
<div class="logo"><h1>XMPRIVAT</h1><p>SHOP</p></div>

<div class="title">ПРИВАТКА</div>
<button class="btn" onclick="g('priv_week')"><span class="ic">👑</span><span class="nm">Приватка на неделю</span><span class="pr">80 ⭐</span></button>
<button class="btn" onclick="g('priv_month')"><span class="ic">👑</span><span class="nm">Приватка на месяц</span><span class="pr">130 ⭐</span></button>
<button class="btn" onclick="g('priv_forever')"><span class="ic">👑</span><span class="nm">Приватка навсегда</span><span class="pr">200 ⭐</span></button>

<div class="title">КОНФИГИ</div>
<button class="btn" onclick="g('conf_100')"><span class="ic">📄</span><span class="nm">Конфиг</span><span class="pr">100 ⭐</span></button>
<button class="btn" onclick="g('conf_priv_175')"><span class="ic">📄</span><span class="nm">Конфиг + приватка</span><span class="pr">175 ⭐</span></button>

<div class="title">СЕТЫ</div>
<button class="btn" onclick="g('set_z5viva')"><span class="ic">⚔️</span><span class="nm">Сет z5 + вива</span><span class="pr">85 ⭐</span></button>
<button class="btn" onclick="g('set_nerkapb')"><span class="ic">⚔️</span><span class="nm">Сет нерка + пб</span><span class="pr">200 ⭐</span></button>

<div class="title">СКРИПТЫ</div>
<button class="btn" onclick="g('sc_totem')"><span class="ic">🛡️</span><span class="nm">Авто тотем</span><span class="pr">25 ⭐</span></button>
<button class="btn" onclick="g('sc_build')"><span class="ic">🧱</span><span class="nm">Застрой</span><span class="pr">25 ⭐</span></button>
<button class="btn" onclick="g('sc_freeze')"><span class="ic">🥶</span><span class="nm">Завис</span><span class="pr">25 ⭐</span></button>
<button class="btn" onclick="g('sc_opt')"><span class="ic">🚀</span><span class="nm">Оптимизации</span><span class="pr">25 ⭐</span></button>

<div class="title">РЕКЛАМА</div>
<button class="btn" onclick="g('adv_day1')"><span class="ic">📢</span><span class="nm">Реклама 1 день</span><span class="pr">65 ⭐</span></button>
<button class="btn" onclick="g('adv_day2')"><span class="ic">📢</span><span class="nm">Реклама 2 дня</span><span class="pr">80 ⭐</span></button>
<button class="btn" onclick="g('adv_day3')"><span class="ic">📢</span><span class="nm">Реклама 3 дня</span><span class="pr">100 ⭐</span></button>
<button class="btn" onclick="g('adv_week')"><span class="ic">📢</span><span class="nm">Реклама неделя</span><span class="pr">150 ⭐</span></button>

<div class="title">СЕРВИС</div>
<button class="btn" onclick="g('profile')"><span class="ic">👤</span><span class="nm">Мой профиль</span></button>
<button class="btn" onclick="g('promos')"><span class="ic">🎫</span><span class="nm">Промокоды</span></button>
<button class="btn" onclick="g('activate')"><span class="ic">🎁</span><span class="nm">Активировать код</span></button>
<button class="btn" onclick="g('support')"><span class="ic">🛠️</span><span class="nm">Поддержка</span></button>

</div><script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
function g(target) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
    if (!tg) { window.location.href = "https://t.me/XMPrivateBot"; return; }
    try {
        tg.sendData(JSON.stringify({ action: "go", target: target }));
        setTimeout(function(){ tg.close(); }, 300);
    } catch(e) { window.location.href = "https://t.me/XMPrivateBot"; }
}
</script>
</body>
</html>
