<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMprivat SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff 0%, #888 50%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        p {
            color: #888;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #222;
            border-color: #666;
            transform: translateY(-2px);
        }
        .emoji { font-size: 22px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>XMprivat</h1>
        <p>Mini App запускается...</p>
        <button class="btn" onclick="alert('Работает!')"><span class="emoji">👑</span>Приватка</button>
        <button class="btn" onclick="alert('Работает!')"><span class="emoji">📄</span>Конфиг</button>
        <button class="btn" onclick="alert('Работает!')"><span class="emoji">⚔️</span>Сеты</button>
        <button class="btn" onclick="alert('Работает!')"><span class="emoji">📜</span>Скрипты</button>
    </div>
</body>
</html>
